{% if messages %}
  <div class="stack-sm" style="margin-bottom: var(--s-8)" data-animate="messages">
    {% for message in messages %}
      <p class="notice {{ message.tags }}" role="status">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-info"/></svg>
        <span>{{ message }}</span>
      </p>
    {% endfor %}
  </div>
{% endif %}
