{% if form.non_field_errors %}
  <p class="notice error" role="alert" style="margin-bottom: var(--s-4)">
    <svg class="icon icon-sm" aria-hidden="true"><use href="#i-alert"/></svg>
    <span>{% for error in form.non_field_errors %}{{ error }}{% if not forloop.last %}<br>{% endif %}{% endfor %}</span>
  </p>
{% endif %}
