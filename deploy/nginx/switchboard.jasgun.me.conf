upstream switchboard_web {
    server unix:/run/switchboard/web.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name switchboard.jasgun.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name switchboard.jasgun.me;

    ssl_certificate     /etc/ssl/cloudflare/jasgun.me.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jasgun.me.key;

    # Cloudflare terminates TLS in front of this; Django reads the scheme from
    # X-Forwarded-Proto and the client IP from CF-Connecting-IP.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 512k;

    # collectstatic output. nginx serves it directly so gunicorn never does.
    location /static/ {
        alias /srv/switchboard/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /health/live {
        proxy_pass http://switchboard_web;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://switchboard_web;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    location / {
        proxy_pass http://switchboard_web;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
