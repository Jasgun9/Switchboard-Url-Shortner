# The main site: switchboard.jasgun.me
#
# This starts as HTTP only. Running certbot adds the HTTPS block and the
# redirect from HTTP automatically, so don't add certificate lines by hand.

upstream switchboard_web {
    server unix:/run/switchboard/web.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name switchboard.jasgun.me;

    # Nothing this app accepts is large. Anything bigger is not a real request.
    client_max_body_size 512k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # CSS, JavaScript and images. Served straight off disk, never touching
    # Python. collectstatic puts them here, with a content hash in the filename,
    # which is why they can be cached forever.
    location /static/ {
        alias /var/www/switchboard/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /health/live {
        proxy_pass http://switchboard_web;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://switchboard_web;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    # Everything else goes to the Django app.
    location / {
        proxy_pass http://switchboard_web;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
