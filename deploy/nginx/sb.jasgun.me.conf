upstream switchboard_redirect {
    server unix:/run/switchboard/redirect.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name sb.jasgun.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sb.jasgun.me;

    ssl_certificate     /etc/ssl/cloudflare/jasgun.me.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jasgun.me.key;

    add_header X-Content-Type-Options nosniff always;

    # Short codes are tiny; nothing here should ever accept a large body.
    client_max_body_size 8k;

    location = /health/live {
        proxy_pass http://switchboard_redirect;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://switchboard_redirect;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    location / {
        proxy_pass http://switchboard_redirect;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}
