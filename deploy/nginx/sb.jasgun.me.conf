# The short-link domain: sb.jasgun.me
#
# Starts as HTTP only. Certbot adds the HTTPS block and the redirect.

upstream switchboard_redirect {
    server unix:/run/switchboard/redirect.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name sb.jasgun.me;

    # A short code is a handful of characters. Nothing sent here is ever big.
    client_max_body_size 8k;

    add_header X-Content-Type-Options nosniff always;

    location = /health/live {
        proxy_pass http://switchboard_redirect;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://switchboard_redirect;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    location / {
        proxy_pass http://switchboard_redirect;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}
